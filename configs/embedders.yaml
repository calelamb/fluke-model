# Embedder configuration for the M-Model-0 prototype.
# All embeddings are L2-normalized at the output for cosine == inner product.

embedders:
  miewid-msv3:
    hf_repo: conservationxlabs/miewid-msv3
    image_size: 440
    embed_dim: 2152  # probed at load time; MiewIdNet over EffNetV2-M actually emits 2152-dim
    license: "UNRESOLVED - no production grant recorded"
    enabled: false
    notes: "Research result only. Remote-code checkpoint must not run in production."

  dinov2-small:
    hf_repo: facebook/dinov2-small
    image_size: 224
    embed_dim: 384
    license: Apache-2.0
    revision: ed25f3a31f01632728cabb09d1542f84ab7b0056
    enabled: true
    notes: "Only production-enabled backbone; every reference index still requires written data rights."

  dinov3-convnext-tiny:
    hf_repo: facebook/dinov3-convnext-tiny-pretrain-lvd1689m
    image_size: 224
    embed_dim: 768
    license: "DINOv3 license (research / non-commercial)"
    enabled: false
    notes: "Research only; excluded from production and the executable registry."
