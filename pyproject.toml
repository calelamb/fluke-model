[project]
name = "fluke-model"
version = "0.1.0"
description = "M-Model-0 prototype: zero-shot photo-ID embedder evaluation for Fluke."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=5.3,<6",
  "timm>=1.0",
  "faiss-cpu>=1.8,<1.13",
  "Pillow>=12.3",
  "numpy>=1.26,<2.3",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "requests>=2.31",
  "certifi>=2026.6.15",
  "idna>=3.15",
  "urllib3>=2.7",
  "kaggle>=1.6",
  "fastapi>=0.115",
  "starlette>=1.3.1",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.31",
]

[dependency-groups]
dev = [
  "bandit>=1.8",
  "bleach>=6.4",
  "httpx2>=2.7",
  "pip-audit>=2.9",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.6",
  "setuptools>=83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluke_model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
