[project]
name = "fluke-model"
version = "0.1.0"
description = "M-Model-0 prototype: zero-shot photo-ID embedder evaluation for Fluke."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=4.45,<4.50",
  "timm>=1.0",
  "faiss-cpu>=1.8,<1.13",
  "Pillow>=10.4",
  "numpy>=1.26,<2.3",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "requests>=2.31",
  "kaggle>=1.6",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluke_model"]

[tool.ruff]
line-length = 100
target-version = "py311"
